  const dot = el('circle', attrs);
  const hit = el('circle', {cx:sx(d.x), cy:sy(d.y), r:Math.max(rad(d.buzz)+4, 10), fill:'transparent', cursor:'pointer'});
  hit.addEventListener('mousemove', ev => { if (!pinned) showTip(d,dot,ev.clientX,ev.clientY); });
  hit.addEventListener('mouseleave', () => { if (!pinned) hideTip(); });
  hit.addEventListener('click', ev => { ev.stopPropagation(); pinned=true; showTip(d,dot,ev.clientX,ev.clientY); });
}
// selective direct labels with greedy collision avoidance
const placed = [];
const CH = 7.3, LH = 16;
const labelIdx = [...LABELED].sort((a,b) => sy(DATA[a].y) - sy(DATA[b].y));
for (const i of labelIdx) {
  const d = DATA[i];
  const nm = d.proj.replace(/ [Pp]roject$/, '');
  const txt = nm.length > 28 ? nm.slice(0,26)+'…' : nm;
  const w = txt.length * CH;
  // clamp x so the text box stays inside the plot
  let tx = Math.max(M.l + w/2 + 4, Math.min(sx(d.x), M.l + pw - w/2 - 4));
  let ty = sy(d.y) - rad(d.buzz) - 7;
  // push down (below the dot) if colliding with an already-placed label
  const collides = y => placed.some(p => Math.abs(p.y - y) < LH && (Math.abs(p.x - tx) < (p.w + w)/2 + 6));
  if (collides(ty)) {
    ty = sy(d.y) + rad(d.buzz) + 13;          // try below the dot
    while (collides(ty)) ty += LH;             // then stack downward
  }
  placed.push({x:tx, y:ty, w});
  const t = el('text', {x:tx, y:ty, fill:'#DDE4EE','font-size':13.5,'text-anchor':'middle','font-weight':500,
    'paint-order':'stroke', stroke:'#060A12','stroke-width':3.5});
  t.textContent = txt;
}
</script>
